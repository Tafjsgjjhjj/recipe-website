
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECITRIENTS</title>
    <link rel="stylesheet" href="real.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav class="title">
        <h1>RECITRIENTS</h1>
         <div class="search">
    <input id="searchInput" placeholder="Search food">
    
    <button class="icon" onclick="searchFood()">🔍</button>
    
  </div>
  <div class="additional-features">
  
  <button class="randomizer" onclick="getRandomRecipe()">🎲</button>
  

  </div>
    </nav>
</header>
        
<section class="food-controls">

  <!-- SEARCH -->
 

  <!-- CATEGORIES -->
  <div class="categories">
    <button onclick="loadCategory('breakfast')">Breakfast</button>
    <button onclick="loadCategory('lunch')">Lunch</button>
    <button onclick="loadCategory('dinner')">Dinner</button>
    <button onclick="loadCategory('snack')">Snack</button>
    <button onclick="loadCategory('dessert')">Dessert</button>
  </div>

</section>

<section class="grid" id="results"></section>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>
<div id="results"></div>
<script>



const API_KEY = "9d7de7d18f134ddeba70c91b1fa77065";

/* =========================
   LOAD DEFAULT RANDOM CARDS
========================= */
window.addEventListener("DOMContentLoaded", () => {
  loadDefaultRandomCards();
});

async function loadDefaultRandomCards() {

  const cachedRecipes = localStorage.getItem("cachedRecipes");

  // If recipes already saved, show them
  if (cachedRecipes) {
    displayRecipes(JSON.parse(cachedRecipes));
    return;
  }

  try {

    const res = await fetch(
      `https://api.spoonacular.com/recipes/random?number=8&apiKey=${API_KEY}`
    );

    const data = await res.json();

    // Save recipes to browser
    localStorage.setItem("cachedRecipes", JSON.stringify(data.recipes));

    displayRecipes(data.recipes);

  } catch (error) {

    console.error(error);

    document.getElementById("results").innerHTML =
      "<p>⚠ Unable to load recipes right now.</p>";

  }
}

/* =========================
   CATEGORY (uses type)
========================= */
function loadCategory(category) {
  fetchRecipesByType(category);
}

/* =========================
   SEARCH (uses query)
========================= */
function searchFood() {
  const query = document.getElementById("searchInput").value;
  fetchRecipesByQuery(query);
}

/* =========================
   FETCH BY TYPE
========================= */
async function fetchRecipesByType(type) {
  try {
    const res = await fetch(
      `https://api.spoonacular.com/recipes/complexSearch?type=${type}&number=8&apiKey=${API_KEY}`
    );

    const data = await res.json();
    displayRecipes(data.results);

  } catch (error) {
    console.error(error);
  }
}

/* =========================
   FETCH BY QUERY
========================= */
async function fetchRecipesByQuery(query) {
  try {
    const res = await fetch(
      `https://api.spoonacular.com/recipes/complexSearch?query=${query}&number=8&apiKey=${API_KEY}`
    );

    const data = await res.json();
    displayRecipes(data.results);

  } catch (error) {
    console.error(error);
  }
}

/* =========================
   DISPLAY CARDS
========================= */
function displayRecipes(recipes) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  if (!recipes || recipes.length === 0) {
    results.innerHTML = "<p>No recipes found.</p>";
    return;
  }

  recipes.forEach(recipe => {
    results.innerHTML += `
    <div class="card">
    <div class="card-img">
      <img src="${recipe.image}" alt="${recipe.title}" onclick="viewRecipe(${recipe.id})">
    </div>
    <h4>${recipe.title}</h4>
  </div>
    `;
  });
}

/* =========================
   RANDOM RECIPE (MODAL ONLY)
========================= */
async function getRandomRecipe() {
  try {
    const res = await fetch(
      `https://api.spoonacular.com/recipes/random?number=1&apiKey=${API_KEY}`
    );

    const data = await res.json();
    const recipe = data.recipes[0];

    viewRecipe(recipe.id);

  } catch (error) {
    console.error(error);
  }
}

/* =========================
   VIEW RECIPE (MODAL)
========================= */
async function viewRecipe(id) {
  try {
    const res = await fetch(
      `https://api.spoonacular.com/recipes/${id}/information?includeNutrition=true&apiKey=${API_KEY}`
    );

    const recipe = await res.json();

    const ingredients = recipe.extendedIngredients
      ?.map(i => `<li>${i.original}</li>`)
      .join("") || "<li>No ingredients available.</li>";

    let instructions = "<li>No instructions available.</li>";
    if (recipe.analyzedInstructions?.length > 0) {
      instructions = recipe.analyzedInstructions[0].steps
        .map(step => `<li>${step.step}</li>`)
        .join("");
    }

    const time = recipe.readyInMinutes || "N/A";
    const servings = recipe.servings || "N/A";
    const cuisine = recipe.cuisines?.join(", ") || "Not specified";

    const difficulty =
      time <= 20 ? "Easy" :
      time <= 45 ? "Medium" :
      "Hard";

    const nutrients = recipe.nutrition?.nutrients
      ?.slice(0, 10)
      .map(n => `
        <li class="nutrient-row">
          <span>${n.name}</span>
          <span>${n.amount}${n.unit}</span>
        </li>
      `)
      .join("") || "<li>No nutrition data available.</li>";

    document.getElementById("modalContent").innerHTML = `
      <div class="modal-header">
        <h1>${recipe.title}</h1>
      </div>

      <div class="recipe-meta">
        <p><strong>⏱ Time:</strong> ${time} mins</p>
        <p><strong>🍽 Servings:</strong> ${servings}</p>
        <p><strong>🌍 Cuisine:</strong> ${cuisine}</p>
        <p><strong>🔥 Difficulty:</strong> ${difficulty}</p>
      </div>

      <div class="modal-body">
        <section>
          <img src="${recipe.image}" class="modal-img">
        </section>

        <section>
          <h2>Ingredients</h2>
          <ul>${ingredients}</ul>
        </section>

        <section>
          <h2>Instructions</h2>
          <ol>${instructions}</ol>
        </section>

        <section>
          <h2>Nutrition Facts</h2>
          <ul>${nutrients}</ul>
        </section>
      </div>

      <div class="modal-footer">
        <button onclick="closeModal()">Close</button>
      </div>
    `;

    document.getElementById("modal").style.display = "flex";

  } catch (error) {
    console.error(error);
  }
}

/* =========================
   CLOSE MODAL
========================= */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}


</script>

</body>
</html>
