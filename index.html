<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECITRIENTS</title>
<link rel="stylesheet" href="real.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav class="title">
        <h1>RECITRIENTS</h1>
        <div class="search">
            <input id="searchInput" placeholder="Search food">
            <button class="icon" onclick="searchFood()">🔍</button>
        </div>
        <div class="additional-features">
            <button class="randomizer" onclick="getRandomRecipe()">🎲</button>
        </div>
    </nav>
</header>
        
<section class="food-controls">
  <!-- CATEGORIES -->
  <div class="categories">
    <button onclick="loadCategory('Breakfast')">Breakfast</button>
    <button onclick="loadCategory('Lunch')">Lunch</button>
    <button onclick="loadCategory('Dinner')">Dinner</button>
    <button onclick="loadCategory('Snack')">Snack</button>
    <button onclick="loadCategory('Dessert')">Dessert</button>
  </div>
</section>

<section class="grid" id="results"></section>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
// ================================
// APIs
// ================================
const MEALDB = "https://www.themealdb.com/api/json/v1/1";
const USDA_KEY = "XOcvdVGfJ3CWGFuKe5Uy46Rjl1YlAeGWkOkQa7YB"; // 🔑 Replace with your USDA API key

// ================================
// Load 8 default random cards in parallel
// ================================
window.addEventListener("DOMContentLoaded", () => {
  loadDefaultRandomCards();
});

async function loadDefaultRandomCards() {
  const promises = Array.from({length: 8}, () => fetch(`${MEALDB}/random.php`).then(r => r.json()));
  const resultsData = await Promise.all(promises);
  const results = resultsData.map(d => d.meals[0]);
  displayRecipes(results);
}

// ================================
// Category mapping
// ================================
const categoryMap = {
  "Breakfast": "Breakfast",
  "Lunch": "Miscellaneous",
  "Dinner": "Chicken",
  "Snack": "Side",
  "Dessert": "Dessert"
};

function loadCategory(category) {
  fetchRecipesByCategory(category);
}

async function fetchRecipesByCategory(category) {
  try {
    const mealdbCategory = categoryMap[category] || "Miscellaneous";
    const res = await fetch(`${MEALDB}/filter.php?c=${mealdbCategory}`);
    const data = await res.json();
    if (!data.meals) return;

    // Pick 8 random meals from category
    const shuffled = data.meals.sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, 8);
    displayRecipes(selected);
  } catch (error) {
    console.error(error);
  }
}

// ================================
// Search
// ================================
function searchFood() {
  const query = document.getElementById("searchInput").value;
  fetchRecipesByQuery(query);
}

async function fetchRecipesByQuery(query) {
  try {
    const res = await fetch(`${MEALDB}/search.php?s=${query}`);
    const data = await res.json();
    displayRecipes(data.meals);
  } catch (error) {
    console.error(error);
  }
}

// ================================
// Display recipes
// ================================
function displayRecipes(recipes) {
  const results = document.getElementById("results");
  results.innerHTML = "";
  if (!recipes || recipes.length === 0) {
    results.innerHTML = "<p>No recipes found.</p>";
    return;
  }

  recipes.forEach(recipe => {
    results.innerHTML += `
      <div class="card">
        <div class="card-img">
          <img src="${recipe.strMealThumb}" alt="${recipe.strMeal}" onclick="viewRecipe('${recipe.idMeal}')">
        </div>
        <h4>${recipe.strMeal}</h4>
      </div>
    `;
  });
}

// ================================
// Random button
// ================================
async function getRandomRecipe() {
  const res = await fetch(`${MEALDB}/random.php`);
  const data = await res.json();
  viewRecipe(data.meals[0].idMeal);
}

// ================================
// View recipe modal
// ================================
async function viewRecipe(id) {
  const res = await fetch(`${MEALDB}/lookup.php?i=${id}`);
  const data = await res.json();
  const meal = data.meals[0];

  // Ingredients
  let ingredientsHTML = "";
  let ingredientList = [];
  for (let i = 1; i <= 20; i++) {
    const ingredient = meal[`strIngredient${i}`];
    const measure = meal[`strMeasure${i}`];
    if (ingredient && ingredient.trim() !== "") {
      ingredientsHTML += `<li>${measure} ${ingredient}</li>`;
      ingredientList.push(ingredient);
    }
  }

  // Show modal immediately
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-header">
      <h1>${meal.strMeal}</h1>
    </div>

    <div class="recipe-meta">
      <p><strong>⏱ Time:</strong> N/A</p>
      <p><strong>🍽 Servings:</strong> N/A</p>
      <p><strong>🌍 Cuisine:</strong> ${meal.strArea || "Not specified"}</p>
      <p><strong>🔥 Difficulty:</strong> N/A</p>
    </div>

    <div class="modal-body">
      <section>
        <img src="${meal.strMealThumb}" class="modal-img">
      </section>

      <section>
        <h2>Ingredients</h2>
        <ul>${ingredientsHTML}</ul>
      </section>

      <h2>Instructions</h2>
<ol>
  ${meal.strInstructions
      .split(/\r?\n|\.\s+/)       // split by line breaks or period+space
      .map(s => s.trim())          // remove extra spaces
      .filter(s => s.length > 0)   // remove empty strings
      .map(step => `<li>${step}</li>`) // wrap each in <li>
      .join('')}
</ol>

      <section>
        <h2>Nutrition Facts </h2>
        <ul id="nutrition-list">
          <li>Loading nutrition...</li>
        </ul>
      </section>
    </div>

    <div class="modal-footer">
      <button onclick="closeModal()">Close</button>
    </div>
  `;

  document.getElementById("modal").style.display = "flex";

  // Fetch top 8 nutrients dynamically
  const nutrition = await fetchTopNutrition(ingredientList);
  const nutritionList = document.getElementById("nutrition-list");
  if (nutrition.length === 0) {
    nutritionList.innerHTML = "<li>No nutrition data available</li>";
  } else {
    nutritionList.innerHTML = nutrition.map(n => `<li class="nutrient-row"><span>${n.name}</span><span>${n.value}</span></li>`).join("");
  }
}

// ================================
// Fetch top 8 nutrients dynamically
// ================================
async function fetchTopNutrition(ingredients) {
  const totals = {};
  const promises = ingredients.slice(0,8).map(ingredient => { // limit top 8 ingredients for speed
    const clean = ingredient.replace(/[0-9/().,]+/g,"").trim();
    return fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${clean}&api_key=${USDA_KEY}`)
      .then(res => res.json())
      .catch(() => null);
  });

  const results = await Promise.all(promises);

  results.forEach(data => {
    if (!data || !data.foods || data.foods.length === 0) return;
    const nutrients = data.foods[0].foodNutrients;
    nutrients.forEach(n => {
      totals[n.nutrientName] = (totals[n.nutrientName] || 0) + n.value;
    });
  });

  // Convert totals to array and pick top 8 by value
  let nutrientsArray = Object.entries(totals).map(([name,value]) => ({name, value}));
  nutrientsArray.sort((a,b) => b.value - a.value);
  const top8 = nutrientsArray.slice(0,8);

  return top8.map(n => ({name: n.name, value: `${n.value.toFixed(1)} ${getUnit(n.name)}`}));
}

// ================================
// Units for nutrients
// ================================
function getUnit(name) {
  if (name === "Energy") return "kcal";
  if (["Protein","Total lipid (fat)","Carbohydrate, by difference","Sugars, total including NLEA","Fiber, total dietary"].includes(name)) return "g";
  if (["Sodium, Na"].includes(name)) return "mg";
  if (["Vitamin C, total ascorbic acid"].includes(name)) return "mg";
  return "";
}

// ================================
// Close modal
// ================================
function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
